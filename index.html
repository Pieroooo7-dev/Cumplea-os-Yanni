<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#08091b">
    <title>Para Yanni 🌷</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app">
        <canvas id="art"></canvas>
        <main class="card" id="card">
            <canvas id="scene"></canvas>
            <div class="copy">
                <h1 id="title"></h1>
                <p id="message"></p>
            </div>
            <button id="action">Toca para comenzar ✨</button>
            <button id="hold" aria-label="Mantén presionada la flor">✿</button>
            <div id="meter">LA MAGIA ESTÁ DESPERTANDO · 0%</div>
            <div id="hint">UN PEQUEÑO UNIVERSO PARA TI</div>
            <div id="signature">Con mucho cariño, para ti ♡</div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
